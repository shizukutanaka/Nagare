name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run core unit tests
        run: node --test tests/core.test.js
      - name: Syntax-check the E2E harness
        run: node --check tests/e2e/main.js && node --check tests/e2e/run.js
