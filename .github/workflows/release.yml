name: Release

# Tag-driven distribution: pushing a v* tag publishes a GitHub Release with
# the product attached. A manual workflow_dispatch run only builds the same
# files and uploads them as an Actions artifact — it never creates a Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run core unit tests
        run: node --test tests/core.test.js
      - name: Package distribution files
        id: package
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p staging dist
          cp nagare.html LICENSE README.md staging/
          cp -r docs staging/
          (cd staging && zip -r "../dist/nagare-${VERSION}.zip" .)
          cp nagare.html dist/
          (cd dist && sha256sum nagare.html "nagare-${VERSION}.zip" > SHA256SUMS.txt)
          ls -l dist
      - name: Upload distribution files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nagare-${{ steps.package.outputs.version }}
          path: dist/

  release:
    # Only a real tag push publishes; workflow_dispatch stops at the artifact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distribution files
        uses: actions/download-artifact@v4
        with:
          name: nagare-${{ needs.package.outputs.version }}
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.package.outputs.version }}" \
            dist/nagare.html \
            "dist/nagare-${{ needs.package.outputs.version }}.zip" \
            dist/SHA256SUMS.txt \
            --title "${{ needs.package.outputs.version }}" \
            --generate-notes
