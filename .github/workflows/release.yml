name: Release

# Tag-driven distribution: pushing a v* tag publishes a GitHub Release with
# the product attached. A manual workflow_dispatch run only builds the same
# files and uploads them as an Actions artifact — it never creates a Release.
# The desktop job builds the Electron app on all three OSes; on a tag its
# binaries are attached to the same Release, on a manual run they stay
# Actions artifacts only.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run core unit tests
        run: node --test tests/core.test.js
      - name: Package distribution files
        id: package
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p staging dist
          cp nagare.html LICENSE README.md staging/
          cp -r docs staging/
          (cd staging && zip -r "../dist/nagare-${VERSION}.zip" .)
          cp nagare.html dist/
          (cd dist && sha256sum nagare.html "nagare-${VERSION}.zip" > SHA256SUMS.txt)
          ls -l dist
      - name: Upload distribution files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nagare-${{ steps.package.outputs.version }}
          path: dist/

  release:
    # Only a real tag push publishes; workflow_dispatch stops at the artifact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distribution files
        uses: actions/download-artifact@v4
        with:
          name: nagare-${{ needs.package.outputs.version }}
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.package.outputs.version }}" \
            dist/nagare.html \
            "dist/nagare-${{ needs.package.outputs.version }}.zip" \
            dist/SHA256SUMS.txt \
            --title "${{ needs.package.outputs.version }}" \
            --generate-notes

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Electron toolchain
        run: npm ci
      - name: Build desktop app (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:${{ matrix.target }}
      - name: Upload desktop build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nagare-desktop-${{ matrix.target }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.zip
            dist-desktop/*.AppImage
          if-no-files-found: error

  desktop-release:
    # Only a real tag push attaches desktop binaries to the Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, release, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop builds
        uses: actions/download-artifact@v4
        with:
          pattern: nagare-desktop-*
          path: desktop
          merge-multiple: true
      - name: Attach desktop builds to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd desktop
          sha256sum * > SHA256SUMS-desktop.txt
          gh release upload "${{ needs.package.outputs.version }}" * \
            --repo "$GITHUB_REPOSITORY" --clobber
